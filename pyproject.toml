[project]
name = "movie-db-llm"
version = "0.1.0"
description = "Movie catalog API with future LLM-assisted features."
authors = [
    { name = "duke", email = "dongyeopdukelee@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
movie-db-llm = "movie_db_llm.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.ruff]
# Follow the traditional PEP 8 maximum line length.
line-length = 79
# Allow lint suggestions that use our minimum supported Python version's syntax.
target-version = "py314"

[tool.ruff.lint]
# E: PEP 8 errors; F: common name and import bugs; I: import ordering;
# UP: safe modern-Python upgrades; B: common bug-prone patterns.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pip>=26.2.1",
    "pyright[nodejs]>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
