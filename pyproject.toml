[project]
name = "movie-db-llm"
version = "0.1.0"
description = "Movie catalog API with future LLM-assisted features."
authors = [
    { name = "duke", email = "dongyeopdukelee@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
movie-db-llm = "movie_db_llm:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.411",
]
