[project]
name = "movie-db-llm"
version = "0.1.0"
description = "Movie catalog API with future LLM-assisted features."
authors = [
    { name = "duke", email = "dongyeopdukelee@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
movie-db-llm = "movie_db_llm:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pip>=26.2.1",
    "pyright[nodejs]>=1.1.411",
]
