services:
  api:
    build: .
    environment:
      DATABASE_URL: sqlite:////app/data/movie_db.sqlite3
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3.5:2b
    depends_on:
      - ollama
    ports:
      - "8000:8000"
    volumes:
      - movie-db-data:/app/data

  ollama:
    image: ollama/ollama:0.40.13
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  movie-db-data:
  ollama-models:
